<script>
/**

const URL_MAPA_ES =
  "https://www.educacaonamao.com.br/wp-content/uploads/2019/11/mapa-districao-regioes-espirito-santo-596x1024.jpg";

let mapaLeaflet = null;

/* ==========================================================
 * INICIALIZAÇÃO
 * ========================================================== */

function carregarTelefones() {
  if (typeof iniciarConsultaTelefones === "function") {
    iniciarConsultaTelefones();
  }
}

/* ==========================================================
 * AGRUPAMENTO
 * ========================================================== */

function contatoPreenchido(valor) {
  const v = String(valor || "").trim();

  return (
    v !== "" &&
    v !== "-" &&
    v !== "–" &&
    v !== "—"
  );
}

function agruparContatosDoSetor(registros) {
  const resultado = {
    telefones: [],
    ramais: [],
    whatsapps: [],
    emails: [],
    enderecos: []
  };

  const vistos = {
    telefones: new Set(),
    ramais: new Set(),
    whatsapps: new Set(),
    emails: new Set(),
    enderecos: new Set()
  };

  function adicionar(tipo, valor) {
    const texto =
      String(valor || "").trim();

    if (
      !contatoPreenchido(texto) ||
      vistos[tipo].has(texto)
    ) {
      return;
    }

    vistos[tipo].add(texto);
    resultado[tipo].push(texto);
  }

  (
    Array.isArray(registros)
      ? registros
      : []
  ).forEach(registro => {
    adicionar(
      "telefones",
      campoTelefone(registro, [
        "telefone",
        "TELEFONE",
        "numero",
        "NUMERO"
      ])
    );

    adicionar(
      "ramais",
      campoTelefone(registro, [
        "ramal",
        "RAMAL"
      ])
    );

    adicionar(
      "whatsapps",
      campoTelefone(registro, [
        "whatsapp",
        "WHATSAPP",
        "WhatsApp"
      ])
    );

    adicionar(
      "emails",
      campoTelefone(registro, [
        "email",
        "EMAIL",
        "E-MAIL",
        "E_MAIL"
      ])
    );

    adicionar(
      "enderecos",
      campoTelefone(registro, [
        "endereco",
        "ENDERECO",
        "Endereço"
      ])
    );
  });

  return resultado;
}

/* ==========================================================
 * FORMATAÇÃO
 * ========================================================== */

function formatarTelefoneConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "-";

  const local =
    numeros.startsWith("55")
      ? numeros.slice(2)
      : numeros;

  if (
    local.length === 11 &&
    local.startsWith("27")
  ) {
    return (
      "(" +
      local.slice(0, 2) +
      ") " +
      local.slice(2, 7) +
      "-" +
      local.slice(7)
    );
  }

  if (
    local.length === 10 &&
    local.startsWith("27")
  ) {
    return (
      "(" +
      local.slice(0, 2) +
      ") " +
      local.slice(2, 6) +
      "-" +
      local.slice(6)
    );
  }

  return String(valor || "-");
}

function formatarWhatsappConsulta(valor) {
  return contatoPreenchido(valor)
    ? formatarTelefoneConsulta(valor)
    : "-";
}

/* ==========================================================
 * LINKS
 * ========================================================== */

function linkWhatsappConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "";

  return (
    "https://wa.me/" +
    (
      numeros.startsWith("55")
        ? numeros
        : "55" + numeros
    )
  );
}

function linkTelefoneConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "";

  const local =
    numeros.startsWith("55")
      ? numeros.slice(2)
      : numeros;

  return "tel:+55" + local;
}

function linkEmailConsulta(valor) {
  return (
    "mailto:" +
    encodeURIComponent(
      String(valor || "")
    )
  );
}

/* ==========================================================
 * BLOCOS DE CONTATO
 * ========================================================== */

function blocoContato(
  titulo,
  valores,
  formatador,
  criadorLink,
  classe
) {
  const lista =
    Array.isArray(valores)
      ? valores.filter(contatoPreenchido)
      : [];

  let html =
    '<div class="contato-bloco">' +
      '<div class="contato-titulo">' +
        escaparConsulta(titulo) +
      '</div>';

  if (!lista.length) {
    return (
      html +
      '<div class="contato-vazio">-</div>' +
      '</div>'
    );
  }

  html +=
    '<div class="contato-lista">';

  lista.forEach(valor => {
    const texto =
      formatador
        ? formatador(valor)
        : valor;

    if (
      criadorLink &&
      contatoPreenchido(valor)
    ) {
      const href =
        criadorLink(valor);

      html +=
        '<a class="contato-item-link ' +
        (classe || "") +
        '" href="' +
        escaparConsulta(href) +
        '"' +
        (
          classe === "whatsapp"
            ? ' target="_blank" rel="noopener noreferrer"'
            : ""
        ) +
        ">" +
        escaparConsulta(texto) +
        "</a>";
    } else {
      html +=
        '<div class="contato-item">' +
          escaparConsulta(texto) +
        "</div>";
    }
  });

  return (
    html +
    "</div></div>"
  );
}

/* ==========================================================
 * MAPA PREMIUM — Leaflet interativo (Visitante)

function obterDensidadeComarca(nomeComarca){
  var lista = (typeof setoresPorComarca!=="undefined" && setoresPorComarca[nomeComarca]) ? setoresPorComarca[nomeComarca] : [];
  return Array.isArray(lista) ? lista.length : 0;
}

function municipioParaComarcas(nomeMunicipio){
  var norm = normalizarTexto(nomeMunicipio||"");
  if(!norm) return [];
  if(typeof ordemComarcas==="undefined" || !ordemComarcas || !ordemComarcas.length) return [];
  // Show ALL comarcas of the municipio regardless of permission; filtering only applies to button visibility, not list presence.
  // Vitória fix: comarcas like "Vitória (Fórum Cível)" share base "vitoria"; parentheses stripped via normalizarTexto still allows includes match both directions.
  // Also handle município GeoJSON name sometimes including accents/case differences.
  var lista=[];
  for(var i=0;i<ordemComarcas.length;i++){
    var c=ordemComarcas[i];
    var cn=normalizarTexto(c);
    // Base comparison: extract base before parenthesis for Vitória-style disambiguation
    var cnBase = cn.split("(")[0].trim();
    var normBase = norm.split("(")[0].trim();
    var match=(cn===norm || cnBase===norm || cnBase===normBase || norm.indexOf(cn)!==-1 || cn.indexOf(norm)!==-1 || normBase.indexOf(cnBase)!==-1 || cnBase.indexOf(normBase)!==-1);
    if(!match) continue;
    if(lista.indexOf(c)===-1) lista.push(c);
  }
  return lista;
}

function municipioParaComarca(nomeMunicipio){
  var lista = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nomeMunicipio) : [];
  if(lista && lista.length) return lista[0];
  return "";
}

function corPorDensidade(dens){
  if(!dens || dens===0) return "#e2e8f0";
  if(dens<=3) return "#bfdbfe";
  if(dens<=7) return "#60a5fa";
  return "#1d63b8";
}

function estiloMunicipio(feature){
  var nome = String(feature.properties.name||feature.properties.NOME||"").trim();
  var comarcas = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nome) : [];
  var dens = 0;
  for(var i=0;i<comarcas.length;i++) dens += obterDensidadeComarca(comarcas[i]);
  var isSel = municipioSelecionado && normalizarTexto(nome)===normalizarTexto(municipioSelecionado);
  return {
    fillColor: isSel ? "#00adb5" : corPorDensidade(dens),
    fillOpacity: dens===0 ? 0.35 : 0.6,
    color: isSel ? "#0f172a" : "#ffffff",
    weight: isSel ? 2.2 : 1.2,
    opacity: 1
  };
}

function aoClicarMunicipio(nomeMunicipio, feature, layer){
  municipioSelecionado = String(nomeMunicipio||"").trim();
  var comarcas = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nomeMunicipio) : [];
  var compNomes = (comarcas && comarcas.length) ? comarcas.slice() : [];
  if(!compNomes.length){
    var single = municipioParaComarca(nomeMunicipio);
    if(single) compNomes=[single];
    else compNomes=[String(nomeMunicipio||"").trim()];
  }
  // Sort compNomes by ordemComarcas order (sheet order)
  try{
    if(typeof ordemComarcas!=="undefined" && ordemComarcas && ordemComarcas.length){
      var ordemIdx={};
      for(var _oi=0; _oi<ordemComarcas.length; _oi++) ordemIdx[ordemComarcas[_oi]]=_oi;
      compNomes.sort(function(a,b){
        var ia = ordemIdx.hasOwnProperty(a) ? ordemIdx[a] : 9999;
        var ib = ordemIdx.hasOwnProperty(b) ? ordemIdx[b] : 9999;
        return ia - ib;
      });
    }
  }catch(eSort){}
  var temComarcaReal = false;
  try{
    if(typeof ordemComarcas!=="undefined"){
      for(var ci=0; ci<compNomes.length; ci++){
        if(ordemComarcas.indexOf(compNomes[ci])!==-1){ temComarcaReal=true; break; }
      }
    } else { temComarcaReal=true; }
  }catch(e){ temComarcaReal=true; }
  if(temComarcaReal){
    // Directly render ALL comarcas of this municipality (unfiltered, all micros) in ordemComarcas order
    try{
      var campo = document.getElementById("campo-pesquisa-consulta");
      if(campo) campo.value = "";
      // Clear microrregiao selection - we show municipality's comarcas directly regardless of filter
      microrregiaoSelecionada = "";
      var selClear = document.getElementById("filtro-microrregiao-consulta");
      if(selClear) selClear.value = "";
      renderizarListaComarcasMunicipio(compNomes, temComarcaReal, layer);
      return;
    }catch(eDirect){ /* fallback to old flow */ }
  }
  var micros=[];
  var microSet={};
  try{
    for(var idx=0; idx<compNomes.length; idx++){
      var cc = compNomes[idx];
      var m = "";
      if(typeof microrregioesPorComarca!=="undefined") m = String(microrregioesPorComarca[cc]||"").trim();
      if(!m && typeof comarcasPorMicrorregiao!=="undefined"){
        for(var k in comarcasPorMicrorregiao){
          if((comarcasPorMicrorregiao[k]||[]).indexOf(cc)!==-1){ m=k; break; }
        }
      }
      if(m && !microSet[m]){ microSet[m]=true; micros.push(m); }
    }
  }catch(e){}
  var microEscolhida="";
  if(micros.length===1) microEscolhida=micros[0];
  else if(micros.length>1) microEscolhida=micros[0];
  else if(!temComarcaReal){
    try{
      var fallbackNome = String(nomeMunicipio||"").trim();
      if(typeof comarcasPorMicrorregiao!=="undefined"){
        for(var k2 in comarcasPorMicrorregiao){
          if((comarcasPorMicrorregiao[k2]||[]).indexOf(fallbackNome)!==-1){ microEscolhida=k2; break; }
        }
      }
    }catch(e2){}
  }
  if(microEscolhida && typeof selecionarMicrorregiaoConsulta==="function"){
    var sel = document.getElementById("filtro-microrregiao-consulta");
    if(sel) sel.value = microEscolhida;
    selecionarMicrorregiaoConsulta(microEscolhida);
  }

        if(_isGC){

      var btnSolicitarHtml = "";
      try{
        var _ehGC2 = typeof usuarioAtual!=="undefined" && usuarioAtual && usuarioAtual.logado===true && String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO";
        if(_ehGC2){

          el.style.outlineOffset = isTarget ? "2px" : "";
          if(isTarget){
            var idT = (typeof chaveSegura==="function") ? chaveSegura(nomeEl) : String(nomeEl).replace(/[^a-zA-Z0-9]/g,"_");

              for(var si=0; si<setoresC.length; si++){
                var setorC=setoresC[si];
                var chaveC=nomeC+"||"+setorC;
                htmlComarca+='<div class="setor-item" onclick="selecionarSetor(event,\''+escaparJs(idC)+'\',\''+escaparJs(setorC)+'\',\''+escaparJs(chaveC)+'\')">'+escaparConsulta(setorC)+'</div>';
              }
              htmlComarca+='</div>';

          }

        // re-apply outline after injection
        var alvos2 = document.querySelectorAll(".comarca-item");
        alvos2.forEach(function(el){
          var nomeEl2 = el.querySelector(".comarca-nome") ? el.querySelector(".comarca-nome").textContent : "";
          var nNorm2 = normalizarTexto(nomeEl2);
          var isTarget2 = !!normAlvos[nNorm2];
          if(!isTarget2){
            for(var qa2 in normAlvos){ if(nNorm2.indexOf(qa2)!==-1 || qa2.indexOf(nNorm2)!==-1){ isTarget2=true; break; }}
          }
          if(isTarget2){
            el.style.outline="2px solid #00adb5";
            el.style.outlineOffset="2px";
            var id2=(typeof chaveSegura==="function")? chaveSegura(nomeEl2) : String(nomeEl2).replace(/[^a-zA-Z0-9]/g,"_");

            if(sec2 && sec2.classList.contains("hidden")) sec2.classList.remove("hidden");

        });
        // refresh primeiroAlvo

          document.querySelectorAll(".comarca-item").forEach(function(el){

            if(normAlvos[normalizarTexto(n)]) primeiroAlvo=el;
          });
        }
      }
      if(primeiroAlvo) primeiroAlvo.scrollIntoView({behavior:"smooth", block:"nearest"});
    }catch(e2){}
  }
  try{ aplicarDestaqueComarcas(); setTimeout(aplicarDestaqueComarcas, 90); }catch(eA){}
  try{
    setTimeout(function(){
      if(typeof camadaGeoJson!=="undefined" && camadaGeoJson && camadaGeoJson.resetStyle) {
        camadaGeoJson.eachLayer(function(l){ if(l.feature) camadaGeoJson.resetStyle(l); });
        if(layer) layer.setStyle({fillColor:"#00adb5", fillOpacity:0.82, color:"#0f172a", weight:2.4});
      }
    },80);
  }catch(eB){}
  try{
    if(compNomes.length===1){
      var unicoNome=compNomes[0];
      var listaSetores = (typeof setoresPorComarca!=="undefined" && setoresPorComarca[unicoNome]) ? setoresPorComarca[unicoNome] : [];
      if(listaSetores && listaSetores.length===1 && typeof selecionarSetor==="function"){
        var unico = listaSetores[0];
        var idSeg = (typeof chaveSegura==="function") ? chaveSegura(unicoNome) : unicoNome;
        var chave = unicoNome + "||" + unico;
        selecionarSetor({currentTarget: document.querySelector('#setores-'+idSeg+' .setor-item')}, idSeg, unico, chave);
      }
    }
  }catch(e3){}
}

function construirTooltipMunicipio(nomeMunicipio){
  var comarcas = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nomeMunicipio) : [];
  if(comarcas && comarcas.length){
    var densTotal=0;
    var microSet={};
    var microLista=[];
    for(var i=0;i<comarcas.length;i++){
      densTotal+=obterDensidadeComarca(comarcas[i]);
      try{
        var mm = (typeof microrregioesPorComarca!=="undefined") ? String(microrregioesPorComarca[comarcas[i]]||"").trim() : "";
        if(mm && !microSet[mm]){ microSet[mm]=true; microLista.push(mm); }
      }catch(e){}
    }
    var microStr = microLista.join(", ");
    var nomesStr = comarcas.length===1 ? comarcas[0] : comarcas.join(", ");
    var linha2 = nomesStr + " \u00b7 " + densTotal + " setor" + (densTotal===1?"":"es") + (microStr?" \u00b7 "+microStr:"");
    if(comarcas.length>1) linha2 = comarcas.length + " comarcas: " + nomesStr + " \u00b7 " + densTotal + " setor" + (densTotal===1?"":"es") + (microStr?" \u00b7 "+microStr:"");
    return '<div class="tooltip-premium">'+ escaparConsulta(nomeMunicipio) + '<small>'+ escaparConsulta(linha2) +'</small></div>';
  }
  var comarca = municipioParaComarca(nomeMunicipio);
  var dens = comarca ? obterDensidadeComarca(comarca) : 0;
  var micro = "";
  try{ if(comarca && typeof microrregioesPorComarca!=="undefined") micro = String(microrregioesPorComarca[comarca]||"").trim(); }catch(e){}
  var linha2 = comarca ? (dens+" setor"+(dens===1?"":"es")+(micro?" \u00b7 "+micro:"")) : (micro||"Munic\u00edpio \u2014 sem comarca direta");
  return '<div class="tooltip-premium">'+ escaparConsulta(nomeMunicipio) + '<small>'+ escaparConsulta(linha2) +'</small></div>';
}

function initMapaLeaflet(containerId, isOverlay){
  var cont = document.getElementById(containerId);
  if(!cont) return null;
  if(typeof L==="undefined"){
    cont.innerHTML = '<div style="padding:24px;text-align:center;color:#64748b;font-size:13px;">Carregando mapa\u2026 <br><small>Leaflet n\u00e3o carregou \u2014 verifique conex\u00e3o.</small></div>';
    setTimeout(function(){ if(typeof L!=="undefined") initMapaLeaflet(containerId, isOverlay); }, 1200);
    return null;
  }
  var mapa = L.map(containerId, { zoomControl:true, attributionControl:true }).setView([-19.5, -40.3], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(mapa);

  function carregar(){
    if(geoJsonCache){
      desenhar(geoJsonCache);
      return;
    }
    fetch(URL_GEOJSON_ES)
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(data){ geoJsonCache = data; desenhar(data); })
      .catch(function(err){
        console.error("GeoJSON ES falhou", err);
        cont.insertAdjacentHTML("beforeend", '<div style="margin-top:10px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;font-size:12px;">N\u00e3o foi poss\u00edvel carregar o mapa vetorial. <button type="button" class="btn btn-secondary" style="margin-left:8px;padding:4px 8px;font-size:11px;" onclick="initMapaLeaflet(\''+containerId+'\','+(isOverlay?'true':'false')+')">Tentar novamente</button><br><small style="color:#b45309">Exibindo mapa ilustrativo.</small></div>');
        var fallback = document.createElement("img");
        fallback.src = URL_MAPA_ES;
        fallback.alt = "Mapa do Esp\u00edrito Santo";
        fallback.style.cssText = "width:100%;max-height:360px;object-fit:contain;margin-top:10px;border-radius:10px;border:1px solid #e2e8f0;";
        cont.appendChild(fallback);
      });
  }

  function desenhar(data){
    var layer = L.geoJSON(data, {
      style: estiloMunicipio,
      onEachFeature: function(feature, lyr){
        var nome = String(feature.properties.name||feature.properties.NOME||"").trim();
        lyr.bindTooltip(construirTooltipMunicipio(nome), { permanent:false, direction:"auto", className:"tooltip-premium", sticky:true });
        lyr.on({
          mouseover: function(e){
            var t = e.target;
            if(normalizarTexto(municipioSelecionado)!==normalizarTexto(nome)){
              t.setStyle({ fillColor:"#00adb5", fillOpacity:0.78, weight:2.2, color:"#0f172a" });
              t.bringToFront();
            }
          },
          mouseout: function(e){
            if(normalizarTexto(municipioSelecionado)===normalizarTexto(nome)){
              e.target.setStyle({fillColor:"#00adb5", fillOpacity:0.85, weight:2.4, color:"#0f172a"});
            } else {
              var parent = isOverlay ? camadaGeoJsonOverlay : camadaGeoJson;
              if(parent) parent.resetStyle(e.target);
            }
          },
          click: function(e){
            L.DomEvent.stopPropagation(e);
            aoClicarMunicipio(nome, feature, e.target);
          }
        });
      }
    }).addTo(mapa);
    if(isOverlay) camadaGeoJsonOverlay = layer; else camadaGeoJson = layer;
    try{ mapa.fitBounds(layer.getBounds(), {padding:[14,14]}); }catch(e2){}
    setTimeout(function(){ try{ mapa.invalidateSize(); if(!isOverlay) { mapa.fitBounds(layer.getBounds(), {padding:[14,14]}); } }catch(e){} }, 220);
    layer.eachLayer(function(l){
      l._nomeNorm = normalizarTexto(String(l.feature.properties.name||"").trim());
    });
  }

  carregar();
  if(isOverlay) mapaLeafletOverlay = mapa; else mapaLeaflet = mapa;
  return mapa;
}

function resetarMapaLeaflet(){

    if(mapaLeaflet && camadaGeoJson){

      camadaGeoJson.eachLayer(function(l){ camadaGeoJson.resetStyle(l); });
      mapaLeaflet.fitBounds(camadaGeoJson.getBounds(), {padding:[14,14]});
      document.querySelectorAll(".comarca-item").forEach(function(el){ el.style.outline=""; });
    }
  }catch(e){}
}

function destacarMapaPorBusca(termoNorm){
  try{
    var parent = camadaGeoJson;
    if(!parent) return;
    if(!termoNorm){
      parent.eachLayer(function(l){ parent.resetStyle(l); l.setStyle({opacity:1, fillOpacity: l.feature? estiloMunicipio(l.feature).fillOpacity : 0.5}); });
      return;
    }
    parent.eachLayer(function(l){
      var nome = l._nomeNorm || normalizarTexto(String(l.feature.properties.name||""));
      var lista = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(String(l.feature.properties.name||"")) : [];
      var match = nome.indexOf(termoNorm)!==-1;
      if(!match && lista && lista.length){
        for(var i=0;i<lista.length;i++){
          var cn = normalizarTexto(lista[i]);
          if(cn.indexOf(termoNorm)!==-1 || termoNorm.indexOf(cn)!==-1){ match=true; break; }
        }
      } else if(!match){
        var comarca = normalizarTexto(municipioParaComarca(String(l.feature.properties.name||"")));
        match = comarca.indexOf(termoNorm)!==-1;
      }
      if(match){
        l.setStyle({opacity:1, fillOpacity:0.75});
        l.bringToFront();
      } else {
        l.setStyle({opacity:0.45, fillOpacity:0.18});
      }
    });
  }catch(e){}
}

function criarMapaOverlay(){

        '</div>' +

  } else {

function abrirModalNovoTelefoneComContexto(comarca, setor){
  try{
    if(typeof abrirModalNovoTelefone==="function") abrirModalNovoTelefone();
    setTimeout(function(){
      try{
        var c = String(comarca||"").trim();
        var s = String(setor||"").trim();
        // Try known IDs for comarca/setor in modal (different modals use different IDs)
        var idsComarca = ["telefone-comarca","modal-comarca","form-comarca","nova-comarca","comarca","campo-comarca"];
        var idsSetor = ["telefone-setor","modal-setor","form-setor","nova-setor","setor","campo-setor"];
        for(var i=0;i<idsComarca.length;i++){
          var el=document.getElementById(idsComarca[i]);
          if(el){ 
            if(el.tagName==="SELECT"){
              for(var o=0;o<el.options.length;o++) if(el.options[o].value===c || el.options[o].textContent.trim()===c){ el.value=el.options[o].value; el.dispatchEvent(new Event('change',{bubbles:true})); break; }
              if(!el.value) el.value=c;
            } else el.value=c;
            break;
          }
        }
        for(var j=0;j<idsSetor.length;j++){
          var el2=document.getElementById(idsSetor[j]);
          if(el2){
            if(el2.tagName==="SELECT"){
              for(var o2=0;o2<el2.options.length;o2++) if(el2.options[o2].value===s || el2.options[o2].textContent.trim()===s){ el2.value=el2.options[o2].value; el2.dispatchEvent(new Event('change',{bubbles:true})); break; }
              if(!el2.value) el2.value=s;
            } else el2.value=s;
            break;
          }
        }
        // Also try microrregiao auto-fill from comarca map
        try{
          if(c && typeof microrregioesPorComarca!=="undefined" && microrregioesPorComarca[c]){
            var micro = microrregioesPorComarca[c];
            var idsMicro=["telefone-microrregiao","modal-microrregiao","form-microrregiao"];
            for(var k=0;k<idsMicro.length;k++){
              var em=document.getElementById(idsMicro[k]);
              if(em){
                if(em.tagName==="SELECT"){
                  for(var o3=0;o3<em.options.length;o3++) if(em.options[o3].value===micro || em.options[o3].textContent.trim()===micro){ em.value=em.options[o3].value; em.dispatchEvent(new Event('change',{bubbles:true})); break; }
                } else em.value=micro;
                break;
              }
            }
          }
        }catch(eM){}
      }catch(e2){}
    }, 220);
  }catch(e){ try{ if(typeof abrirModalNovoTelefone==="function") abrirModalNovoTelefone(); }catch(e2){} }
}

var filtroConsultaTimer=null; function filtrarSetoresConsultaDebounced(){ clearTimeout(filtroConsultaTimer); filtroConsultaTimer=setTimeout(filtrarSetoresConsulta,120); }

function filtrarSetoresConsulta() {
  const campo =
    document.getElementById(
      "campo-pesquisa-consulta"
    );

  const termo =
    normalizarTexto(
      campo?.value || ""
    );

  if (!termo) {
    renderizarComarcas();
    return;
  }

  // Termo ativo: garante lista global em ordem da planilha (ordemComarcas)
  // Corrige fragilidade "no microrregião + termo" e "microrregião + termo": busca deve mostrar
  // TODAS as comarcas que casam em sheet order, ignorando microrregião. Evita loop verificando DOM.
  if (!document.querySelector(".comarca-item")) {
    renderizarComarcas();
    return;
  }

  if (termo && microrregiaoSelecionada) {
    try {
      if (typeof ordemComarcas !== "undefined" && ordemComarcas.length) {
        const totalDOM = document.querySelectorAll(".comarca-item").length;
        const primeiroGlobal = normalizarTexto(ordemComarcas[0] || "");
        const primeiroDOM = normalizarTexto(document.querySelector(".comarca-item .comarca-nome")?.textContent || "");
        const precisaGlobal = totalDOM !== ordemComarcas.length || (primeiroGlobal && primeiroDOM !== primeiroGlobal);
        if (precisaGlobal) {
          renderizarComarcas();
          return;
        }
      }
    } catch (e) {}
  }

  document
    .querySelectorAll(
      ".comarca-item"
    )
    .forEach(
      comarcaItem => {
        const setoresList =
          comarcaItem.nextElementSibling;

        const nomeComarca =
          normalizarTexto(
            comarcaItem.querySelector(
              ".comarca-nome"
            )?.textContent || ""
          );

        const setores =
          setoresList
            ? Array.from(
                setoresList.querySelectorAll(
                  ".setor-item"
                )
              )
            : [];

        const comarcaEncontrada =
          nomeComarca.includes(
            termo
          );

        let setorEncontrado =
          false;

        setores.forEach(
          setor => {
            const encontrou =
              normalizarTexto(
                setor.textContent
              ).includes(termo);

            setor.style.display =
              encontrou ? "" : "none";

            if (encontrou) {
              setorEncontrado = true;
            }
          }
        );

        const mostrar =
          comarcaEncontrada ||
          setorEncontrado;

        comarcaItem.style.display =
          mostrar ? "" : "none";

        if (!setoresList) {
          return;
        }

        if (!mostrar) {
          setoresList.classList.add("hidden");
          setoresList.style.display = "none";
          setores.forEach(function(s){ s.style.display = "none"; });
        } else if (comarcaEncontrada) {
          // Pesquisa casou no nome da comarca → mostra TODOS os setores dela (ordem da planilha)
          setores.forEach(function(s){ s.style.display = ""; });
          setoresList.classList.remove("hidden");
          setoresList.style.display = "";
        } else {
          // Pesquisa casou só em setor → mostra apenas setores filtrados
          // (já filtrados acima via setorEncontrado)
          setoresList.classList.remove("hidden");
          setoresList.style.display = "";
        }
      }
    );
  try{ destacarMapaPorBusca(normalizarTexto(campo?.value||"")); }catch(e){}

}

      }

    } else if(typeof imprimirMultiplasComarcas==="function"){

      var lista=[];
      if(typeof ordemComarcas!=="undefined"&&ordemComarcas){
        if(perm===null) lista=ordemComarcas.slice();
        else if(Array.isArray(perm)&&perm.length){
          for(var i=0;i<ordemComarcas.length;i++){
            var c=ordemComarcas[i];
            var ck=typeof normalizarChaveTabela==="function"?normalizarChaveTabela(c):String(c).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
            if(perm.indexOf(ck)!==-1) lista.push(c);
          }
          if(!lista.length) lista=ordemComarcas.slice();
        } else lista=ordemComarcas.slice();
        return imprimirMultiplasComarcas(lista);
      }
      if(typeof mostrarToast==="function") mostrarToast("Impress\u00e3o em preparo","info");

function imprimirConsultaPDF() {
  const tituloOriginal =
    document.title;

  const tituloInterface =
    document
      .querySelector(
        ".system-title h1"
      )
      ?.textContent
      .replace(/\s+/g, " ")
      .trim() ||
    "SISTEMA INTELIGENTE DE GESTÃO DE TELEFONES DO PJES";

  document.title =
    tituloInterface;

  window.addEventListener(
    "afterprint",
    function restaurarTitulo() {
      document.title =
        tituloOriginal;

      window.removeEventListener(
        "afterprint",
        restaurarTitulo
      );
    },
    { once: true }
  );

  window.print();
}
