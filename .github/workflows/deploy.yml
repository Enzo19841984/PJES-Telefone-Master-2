name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Clasp
      run: npm install -g @google/clasp

    - name: Create clasprc.json
      env:
        CLASPRC_CONTENT: ${{ secrets.CLASPRC_JSON }}
      run: echo "$CLASPRC_CONTENT" > ~/.clasprc.json

    - name: Push code to Apps Script
      run: clasp push -f

